name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Postgres efímero
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          printf 'DATABASE_URL=%s\n' "postgresql://calu:${pw}@127.0.0.1:5432/caluservers?schema=public" >> "$GITHUB_ENV"
          docker run -d --name ci-pg \
            -e POSTGRES_USER=calu \
            -e POSTGRES_PASSWORD="$pw" \
            -e POSTGRES_DB=caluservers \
            -p 127.0.0.1:5432:5432 \
            postgres:16
          for _ in $(seq 1 40); do
            if docker exec ci-pg pg_isready -U calu -d caluservers; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
